[project]
name = "roundup-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30",
    "anyio>=4",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "basedpyright>=1.30", "httpx2>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["postgres: requires ROUNDUP_TEST_DATABASE_URL; creates and drops an owned schema"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["ALL"]
# Choose one docstring convention; do not invent copyright ownership.
ignore = ["D203", "D213", "CPY001"]

[tool.ruff.lint.per-file-ignores]
# Pytest assertions, fixture parameters, descriptive test names, and concrete expected values.
"tests/**" = ["S101", "D", "ARG001", "PLR2004"]

[tool.basedpyright]
typeCheckingMode = "all"
include = ["database.py", "inquiries.py", "seed.py", "init_db.py"]
